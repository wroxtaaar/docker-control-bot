services:
  docker-controller:
    build: .
    container_name: docker-control-bot
    restart: unless-stopped

    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID}
      TERABOX_COMPOSE_FILE: /home/ubuntu/terabox-telegram-bot/vps/docker-compose.yml
      # Change this to your provider's actual monthly bandwidth allowance.
      VPS_BANDWIDTH_GB: ${VPS_BANDWIDTH_GB:-10240}
      BANDWIDTH_STATE_FILE: /data/bandwidth_state.json
      PROJECTS_FILE: /data/projects.json

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Project directories are accessed by the Compose CLI inside the controller.
      # Docker socket access already gives this bot host-level Docker control.
      - /home/ubuntu:/home/ubuntu
      - ./data:/data
